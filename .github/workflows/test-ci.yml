# GitHub Actions test workflow for ChangeScribe-Changelog-Action
name: Test ChangeScribe Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Test the action
        run: |
          python -m pytest tests/ -v
          echo 'Action tests passed!'
